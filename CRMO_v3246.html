    .lb-controls {

    }

    .thumb-strip {

    }

    .dropzone {

      background: linear-gradient(180deg, #fcfcfc 0%, #f6f6f6 100%);

      text-align: center;

    .editor-sticky-actions { position: sticky; bottom: 0; z-index: 8; display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; padding:12px 14px; margin-top:16px; background:rgba(255,255,255,.96); border-top:1px solid #e7e7e7; backdrop-filter: blur(8px); }

      overflow: hidden;

    .editor-preview-stage img,

      height: 100%;

    .editor-actions {

      flex-wrap: wrap;
    }

.crmo-auth-modal__label{

  margin:0 0 5px;
  text-align:right;
}
.crmo-auth-modal__input,
.crmo-auth-modal__password-input{
  width:100%;

.crmo-auth-modal__password{position:relative}
.crmo-auth-modal__password-input{
  direction:ltr;
  text-align:left;
  unicode-bidi:plaintext;
  padding-inline-start:16px;
  padding-inline-end:50px;
}
.crmo-auth-modal__password-toggle{
  position:absolute;
  top:50%;
  right:14px;
  transform:translateY(-50%);
  width:24px;
  height:24px;
  border:0;
  background:transparent;
  color:#111;
  display:grid;
  place-items:center;
  cursor:pointer;
  padding:0;
}
.crmo-auth-modal__password-toggle svg{width:20px; height:20px; display:block}
.crmo-auth-modal__row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  direction:rtl;
  gap:12px;
  margin:4px 0 10px;
}
.crmo-auth-modal__login-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  direction:rtl;
  gap:12px;
  margin:4px 0 10px;
}
.crmo-auth-modal__link{
  color:var(--crmo-auth-danger);
  text-decoration:none;
  font-size:13px;
}
.crmo-auth-modal__remember{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  direction:rtl;
  white-space:nowrap;
}
.crmo-auth-modal__remember input{width:16px; height:16px; margin:0}
.crmo-auth-modal__submit{
  width:100%;
  padding:14px 16px;
  border-radius:16px;
  font:inherit;
  font-size:17px;
  font-weight:700;
  background:#111;
  color:#fff;
  border:1px solid #111;
  cursor:pointer;
}
.crmo-auth-modal__submit[disabled]{opacity:.65; cursor:wait}
.crmo-auth-modal__feedback{
  min-height:20px;
  margin-top:8px;
  font-size:13px;
  text-align:right;
}
.crmo-auth-modal__feedback.is-error{color:#b00020}
.crmo-auth-modal__feedback.is-success{color:#156d2f}
.crmo-auth-modal__bottom{
  display:flex;
  justify-content:center;
  gap:5px;
  margin-top:10px;
  font-size:13px;
}
.crmo-auth-modal__status{
  display:none;
  text-align:center;
  font-size:12px;
  color:var(--crmo-auth-muted);
  margin-top:8px;
}
.crmo-auth-modal__status.is-visible{display:block}
